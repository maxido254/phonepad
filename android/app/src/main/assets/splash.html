<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PCStation Gamepad</title>
<style>
  /* Startup screen. Bundled in the app: no network, fonts or images needed. */
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { height:100%; background:#05070b; overflow:hidden; font-family:'Segoe UI','Helvetica Neue',system-ui,sans-serif; }
  #fx { position:fixed; inset:0; width:100%; height:100%; transition:opacity .5s; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity .45s; }
  #logo { height:38vh; aspect-ratio:400/240; opacity:0; transform:scale(.9); transition:opacity 1s ease-out, transform 1.2s cubic-bezier(.2,.8,.2,1);
          filter:drop-shadow(0 0 22px rgba(61,155,255,.35)); }
  #logo.show { opacity:1; transform:scale(1); }
  #logo.pulse #gamepad path[filter] { animation:bars 1.8s ease-in-out infinite; }
  @keyframes bars { 0%,100% { opacity:1; } 50% { opacity:.45; } }
  #name { margin-top:3.2vh; color:#fff; font-size:clamp(16px,5.4vh,32px); white-space:nowrap; opacity:0; letter-spacing:.7em; padding-left:.7em;
          transition:opacity 1.1s ease-out, letter-spacing 1.6s cubic-bezier(.2,.8,.2,1), padding-left 1.6s cubic-bezier(.2,.8,.2,1); }
  #name b { font-weight:700; } #name i { font-style:normal; font-weight:300; color:#9fb0c3; }
  #name.show { opacity:1; letter-spacing:.08em; padding-left:.08em; }
  #dots { margin-top:3vh; display:flex; gap:14px; height:10px; }
  #dots span { width:10px; height:10px; border-radius:50%; opacity:0; transform:scale(.3); transition:opacity .5s, transform .5s cubic-bezier(.3,1.6,.5,1); }
  #dots span.show { opacity:1; transform:scale(1); box-shadow:0 0 12px currentColor; }
  #skip { position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 8px); left:0; right:0; text-align:center; color:#6b7785; font-size:11px; letter-spacing:.1em; opacity:0; transition:opacity .6s; }
  #skip.show { opacity:.8; }
  body.out #stage, body.out #fx, body.out #skip { opacity:0; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="stage">
  <svg id="logo" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9cfdb"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232832"/><stop offset="1" stop-color="#090b0f"/></linearGradient>
  <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef1f7"/><stop offset="1" stop-color="#b7bfcd"/></linearGradient>
  <radialGradient id="knob" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#5a6270"/><stop offset="1" stop-color="#1c2028"/></radialGradient>
  <linearGradient id="bump" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b303a"/><stop offset="1" stop-color="#0d0f14"/></linearGradient>
  <filter id="glow" x="-80%" y="-30%" width="260%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <path id="half" d="M200 50 L262 50 C290 50 312 38 338 40 C372 44 392 90 396 150 C400 200 384 228 354 228 C326 228 308 204 284 176 C268 158 250 150 226 150 L200 150 Z"/>
  <path id="bumper" d="M262 42 C290 26 334 18 352 40 C340 42 330 42 322 46 C300 40 282 42 266 52 Z"/>
</defs>
<g id="gamepad">
  <use href="#bumper" fill="url(#bump)"/><use href="#bumper" fill="url(#bump)" transform="translate(400,0) scale(-1,1)"/>
  <use href="#half" fill="url(#shell)"/><use href="#half" fill="url(#shell)" transform="translate(400,0) scale(-1,1)"/>
  <path d="M122 40 C165 47 235 47 278 40 L298 118 C306 156 292 198 252 200 L148 200 C108 198 94 156 102 118 Z" fill="url(#core)"/>
  <rect x="168" y="62" width="64" height="48" rx="9" ry="9" fill="url(#pad)"/>
  <path d="M158 60 C153 78 153 98 160 114" fill="none" stroke="#3d9bff" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M242 60 C247 78 247 98 240 114" fill="none" stroke="#3d9bff" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="200" cy="130" r="7" fill="none" stroke="#c9cfdb" stroke-width="2.5"/>
  <rect x="170" y="126" width="12" height="5" rx="2.5" fill="#6b7482"/><rect x="218" y="126" width="12" height="5" rx="2.5" fill="#6b7482"/>
  <circle cx="148" cy="162" r="23" fill="#0b0d11" stroke="#2f3541" stroke-width="3"/><circle cx="148" cy="162" r="14" fill="url(#knob)" stroke="#59616f" stroke-width="2"/>
  <circle cx="252" cy="162" r="23" fill="#0b0d11" stroke="#2f3541" stroke-width="3"/><circle cx="252" cy="162" r="14" fill="url(#knob)" stroke="#59616f" stroke-width="2"/>
  <g fill="#aeb6c4" stroke="#8d96a6" stroke-width="1.2">
    <rect x="61" y="62" width="17" height="21" rx="4"/><rect x="61" y="95" width="17" height="21" rx="4"/>
    <rect x="39" y="84" width="21" height="17" rx="4"/><rect x="79" y="84" width="21" height="17" rx="4"/>
  </g>
  <g stroke="#8d96a6" stroke-width="1.5">
    <circle cx="330" cy="68" r="11" fill="#e3e7ef"/><circle cx="330" cy="116" r="11" fill="#e3e7ef"/>
    <circle cx="306" cy="92" r="11" fill="#e3e7ef"/><circle cx="354" cy="92" r="11" fill="#e3e7ef"/>
  </g>
  <circle cx="330" cy="68" r="4.5" fill="#33d6a6"/><circle cx="330" cy="116" r="4.5" fill="#4d8dff"/>
  <circle cx="306" cy="92" r="4.5" fill="#f08ad8"/><circle cx="354" cy="92" r="4.5" fill="#ff5d6c"/>
</g></svg>
  <div id="name"><b>PCStation</b> <i>Gamepad</i></div>
  <div id="dots"><span style="background:#2f7bff;color:#2f7bff"></span><span style="background:#ff4d5a;color:#ff4d5a"></span><span style="background:#3fb950;color:#3fb950"></span><span style="background:#f08ad8;color:#f08ad8"></span></div>
</div>
<div id="skip">TAP TO SKIP</div>

<script>
// Timeline (seconds): 0-2 light ribbons flow in and gather, 2.0 flash + gamepad appears,
// 2.9 name, 3.4-4 player dots, 4.9 fade out, then the connect screen opens.
const T_LOGO = 2.0, T_NAME = 2.9, T_DOTS = 3.4, T_OUT = 4.9, T_DONE = 5.4;

const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function size() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', size); size();

const rnd = (a, b) => a + Math.random() * (b - a);
const ease = (a, b, t) => { t = Math.min(1, Math.max(0, (t - a) / (b - a))); return t * t * (3 - 2 * t); };

const ribbons = Array.from({ length: 9 }, (_, i) => ({
  off: (i - 4) * 0.045 + rnd(-0.01, 0.01), amp: rnd(0.07, 0.17), f: rnd(0.0035, 0.0075), sp: rnd(0.5, 1.1) * (i % 2 ? 1 : -1),
  ph: rnd(0, 6.28), w: rnd(1.2, 2.6), hue: rnd(198, 218), a: rnd(0.45, 0.9)
}));
const dust = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), v: rnd(0.012, 0.05), r: rnd(0.6, 1.9), p: rnd(0, 6.28) }));

function draw(t, dt) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(W / 2, H * 0.6, 0, W / 2, H * 0.6, Math.max(W, H) * 0.7);
  bg.addColorStop(0, 'rgba(24,52,104,.55)'); bg.addColorStop(0.5, 'rgba(8,16,36,.35)'); bg.addColorStop(1, 'rgba(5,7,11,0)');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  const intro = ease(0, 1.5, t);
  const calm = 1 - ease(T_LOGO - 0.1, T_LOGO + 1.4, t);            // ribbons settle behind the logo
  const energy = 0.2 + 0.8 * calm;
  ctx.globalCompositeOperation = 'lighter';
  ribbons.forEach(r => {
    const g = ctx.createLinearGradient(0, 0, W, 0);
    const c = `hsla(${r.hue},100%,68%,`;
    g.addColorStop(0, c + '0)'); g.addColorStop(0.25, c + (r.a * energy * intro) + ')');
    g.addColorStop(0.5, 'hsla(200,100%,88%,' + (r.a * energy * intro) + ')'); g.addColorStop(0.75, c + (r.a * energy * intro) + ')'); g.addColorStop(1, c + '0)');
    const amp = r.amp * H * (0.3 + 0.7 * energy) * (0.4 + 0.6 * intro);
    const path = () => {
      ctx.beginPath();
      for (let x = -10; x <= W + 10; x += 8) {
        const y = H * (0.5 + r.off * (0.4 + 0.6 * energy)) + Math.sin(x * r.f + t * r.sp + r.ph) * amp + Math.sin(x * r.f * 2.2 - t * r.sp * 0.7) * amp * 0.3;
        x < 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
    };
    ctx.strokeStyle = g;
    ctx.lineWidth = r.w * 7; ctx.globalAlpha = 0.14; path(); ctx.stroke();   // soft glow
    ctx.lineWidth = r.w; ctx.globalAlpha = 1; path(); ctx.stroke();           // bright core
  });

  ctx.globalAlpha = 1;
  dust.forEach(d => {
    d.y -= d.v * dt; if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); }
    const a = (0.25 + 0.35 * Math.sin(t * 1.6 + d.p)) * intro;
    ctx.fillStyle = `rgba(190,225,255,${Math.max(0, a)})`;
    ctx.beginPath(); ctx.arc(d.x * W, d.y * H, d.r, 0, 6.283); ctx.fill();
  });

  // reveal flash when the gamepad appears
  const f = t - T_LOGO;
  if (f > -0.15 && f < 1.1) {
    const k = f < 0 ? (f + 0.15) / 0.15 : 1 - f / 1.1;
    const fl = ctx.createRadialGradient(W / 2, H * 0.46, 0, W / 2, H * 0.46, Math.max(W, H) * 0.55);
    fl.addColorStop(0, `rgba(170,215,255,${0.5 * k * k})`); fl.addColorStop(1, 'rgba(170,215,255,0)');
    ctx.fillStyle = fl; ctx.fillRect(0, 0, W, H);
  }
}

const logo = document.getElementById('logo'), nameEl = document.getElementById('name');
const dots = [...document.querySelectorAll('#dots span')], skip = document.getElementById('skip');
let t0 = performance.now(), last = t0, done = false, step = 0;

function finish() {
  if (done) return; done = true;
  document.body.classList.add('out');
  setTimeout(() => { try { window.SplashNative && SplashNative.done(); } catch (e) { } }, 450);
}
function frame(now) {
  const t = (now - t0) / 1000, dt = Math.min(0.05, (now - last) / 1000); last = now;
  draw(t, dt);
  if (step < 1 && t > 1.0) { skip.classList.add('show'); step = 1; }
  if (step < 2 && t > T_LOGO) { logo.classList.add('show'); setTimeout(() => logo.classList.add('pulse'), 1000); step = 2; }
  if (step < 3 && t > T_NAME) { nameEl.classList.add('show'); step = 3; }
  if (step < 4 && t > T_DOTS) { dots.forEach((d, i) => setTimeout(() => d.classList.add('show'), i * 160)); step = 4; }
  if (step < 5 && t > T_OUT) { step = 5; finish(); }
  if (!done || t < T_DONE + 1) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('pointerdown', finish);
</script>
</body>
</html>
