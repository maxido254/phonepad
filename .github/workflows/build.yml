name: Build apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Locate project folder
        shell: bash
        run: echo "ROOT=$(dirname "$(dirname "$(find . -name phonepad_pc.py -not -path './.git/*' | head -1)")")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        shell: bash
        run: gradle -p "$ROOT/android" assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhonePad-Android
          path: ${{ env.ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Windows app (EXE)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Locate project folder
        shell: bash
        run: echo "ROOT=$(dirname "$(dirname "$(find . -name phonepad_pc.py -not -path './.git/*' | head -1)")")" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        shell: bash
        env:
          VGAMEPAD_SKIP_VIGEMBUS_INSTALL: 'true'
        run: pip install -r "$ROOT/pc/requirements.txt" pyinstaller
      - name: Build exe
        shell: bash
        run: pyinstaller --onefile --windowed --name PhonePad-PC --collect-all vgamepad "$ROOT/pc/phonepad_pc.py"
      - uses: actions/upload-artifact@v4
        with:
          name: PhonePad-Windows
          path: dist/PhonePad-PC.exe
