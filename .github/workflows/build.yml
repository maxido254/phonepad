name: Build PCStation Gamepad

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Locate project folder
        shell: bash
        run: |
          F=$(find . -name pcstation_gamepad.py -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "pc/pcstation_gamepad.py not found in the repo"; ls -R; exit 1; fi
          ROOT=$(dirname "$(dirname "$F")")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project folder: $ROOT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle -p "$ROOT/android" assembleRelease
      - name: Sign the release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          IN="$(ls "$ROOT"/android/app/build/outputs/apk/release/*.apk | head -1)"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            A="$KEY_ALIAS"; SP="$KEYSTORE_PASSWORD"; KP="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::No signing secrets set: using a one-off key. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS to the repo secrets so updates install over older versions."
            SP=changeit1; KP=changeit1; A=app
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$SP" -keypass "$KP" -alias "$A" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=App, O=Maxido Entertainment"
          fi
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$A" --ks-pass "pass:$SP" --key-pass "pass:$KP" --out "$ROOT/PCStation-Gamepad.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$ROOT/PCStation-Gamepad.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PCStation-Gamepad-Android
          path: ${{ env.ROOT }}/PCStation-Gamepad.apk

  windows:
    name: Windows app (EXE)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Locate project folder
        run: |
          F=$(find . -name pcstation_gamepad.py -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "pc/pcstation_gamepad.py not found in the repo"; ls -R; exit 1; fi
          ROOT=$(dirname "$(dirname "$F")")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        env:
          # vgamepad normally launches the ViGEmBus GUI installer during pip install,
          # which hangs on a build server. Skip it: the driver is installed on your PC instead.
          VGAMEPAD_SKIP_VIGEMBUS_INSTALL: 'true'
        run: pip install -r "$ROOT/pc/requirements.txt" pyinstaller
      - name: Check the PC app compiles
        run: python -m py_compile "$ROOT"/pc/pcstation_gamepad.py "$ROOT"/pc/pcstation_launcher.py "$ROOT"/pc/pcstation_launcher_ui.py "$ROOT"/pc/pcstation_icon.py
      - name: Launcher tests (informational)
        continue-on-error: true
        run: python -m unittest discover -s "$ROOT/pc/tests" -v
      - name: Build exe
        run: pyinstaller --onefile --windowed --name PCStation-Gamepad --icon "$ROOT/branding/icon.ico" --collect-all vgamepad "$ROOT/pc/pcstation_gamepad.py"
      - uses: actions/upload-artifact@v4
        with:
          name: PCStation-Gamepad-Windows
          path: dist/PCStation-Gamepad.exe

  installer:
    name: Windows installer (MSI)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PCStation-Gamepad-Windows
          path: payload
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          export PATH="$PATH:$HOME/.dotnet/tools"
          echo "$USERPROFILE\\.dotnet\\tools" >> "$GITHUB_PATH"
          wix --version
          wix extension add --global WixToolset.Firewall.wixext/5.0.2
      - name: Build the MSI
        run: |
          F=$(find . -name Product.wxs -path '*installer*' -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "installer/Product.wxs not found"; exit 1; fi
          ROOT=$(dirname "$(dirname "$F")")
          mkdir build
          cp "$F" build/Product.wxs
          cp payload/PCStation-Gamepad.exe build/
          cp "$ROOT/branding/icon.ico" build/
          cd build
          sed -i "s/__VERSION__/1.0.${{ github.run_number }}/" Product.wxs
          wix build -arch x64 -ext WixToolset.Firewall.wixext -o PCStation-Gamepad-Setup.msi Product.wxs
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: PCStation-Gamepad-Installer
          path: build/PCStation-Gamepad-Setup.msi

  release:
    name: Publish downloads
    needs: [android, installer]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.android.result == 'success' && needs.installer.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PCStation-Gamepad-Android
          path: dl
      - uses: actions/download-artifact@v4
        with:
          name: PCStation-Gamepad-Installer
          path: dl
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dl
          gh release create "v1.0.${{ github.run_number }}" dl/* --repo "${{ github.repository }}" --title "PCStation Gamepad 1.0.${{ github.run_number }}" --notes "Android app: PCStation-Gamepad.apk. Windows installer: PCStation-Gamepad-Setup.msi."
